x-common-env: &common-env

  DJANGO_SUPERUSER_USERNAME: admin
  DJANGO_SUPERUSER_EMAIL: admin@example.com
  DJANGO_SUPERUSER_PASSWORD: admin

  POSTGRES_USER: galaxy_ng
  POSTGRES_PASSWORD: galaxy_ng
  POSTGRES_DB: galaxy_ng

  # Disable Pulp integrations
  GALAXY_ENABLE_PULP_INTEGRATION: 'false'
  
  # Filesystem content management
  GALAXY_CONTENT_ROOT: '/content'
  GALAXY_TASK_STORAGE: '/var/lib/galaxy/tasks'
  
  # Task system configuration
  GALAXY_TASK_WORKERS: 4
  GALAXY_TASK_POLL_INTERVAL: 5
  GALAXY_TASK_RETENTION_DAYS: 30
  GALAXY_WORKER_TIMEOUT_MINUTES: 5
  
  # Validation settings
  GALAXY_QUICK_VALIDATION: 'true'
  GALAXY_REQUIRE_CONTENT_APPROVAL: 'true'

  # Database configuration
  DATABASES__default__ENGINE: django.db.backends.postgresql
  DATABASES__default__NAME: galaxy_ng
  DATABASES__default__USER: galaxy_ng
  DATABASES__default__PASSWORD: galaxy_ng
  DATABASES__default__HOST: postgres
  DATABASES__default__PORT: 5432

  DJANGO_DEBUG: 1
  GALAXY_DEPLOYMENT_MODE: 'standalone'

  # Hostname and prefix configuration
  GALAXY_API_PATH_PREFIX: '/api/galaxy/'
  ANSIBLE_API_HOSTNAME: 'http://localhost:5001'
  CSRF_TRUSTED_ORIGINS: "['http://localhost']"

  # Authentication
  GALAXY_AUTHENTICATION_CLASSES: "['galaxy_ng.app.auth.session.SessionAuthentication', 'rest_framework.authentication.TokenAuthentication', 'rest_framework.authentication.BasicAuthentication']"
  ANSIBLE_BASE_JWT_VALIDATE_CERT: 'false'
  ANSIBLE_BASE_JWT_KEY: 'https://localhost'

  # API spec access
  GALAXY_API_SPEC_REQUIRE_AUTHENTICATION: 'false'

  # Integration test settings
  HUB_API_ROOT: 'http://localhost:5001/api/galaxy/'
  HUB_TEST_MARKS: deployment_standalone or all
  CONTAINER_REGISTRY: 'localhost:5001'

  # Development settings
  LOCK_REQUIREMENTS: 0
  DEV_SOURCE_PATH:
  ENABLE_DEBUGPY:

# Allow attaching to the running container
x-debugging: &debugging
  stdin_open: true
  tty: true

services:
  base_img:
    build:
      context: ../../
      dockerfile: Dockerfile
      args:
        USER_ID: "${USER_ID:-1000}"
    image: "localhost/galaxy_ng/galaxy_ng:filesystem"

  base_img_dev:  # Extends base_img with extra files and dev tools
    depends_on:
      - base_img
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        <<: *common-env
      additional_contexts:
        base_img: service:base_img
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"

  postgres:
    image: "postgres:15"
    ports:
      - '5433:5432'
    environment:
      <<: *common-env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "galaxy_ng"]
      interval: 10s
      retries: 5
    volumes:
      - "pg_data:/var/lib/postgresql/data"

  migrations:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    environment:
      <<: *common-env
    user: root
    <<: *debugging
    command: |
      bash -c "
        set -e;
        rm -rf /var/lib/galaxy/.migrated;
        /src/galaxy_ng/dev/compose/bin/devinstall;

        # Create content directories
        mkdir -p /content/{collections,repositories,metadata};
        mkdir -p /var/lib/galaxy/tasks;

        # Run Django migrations
        python /src/manage.py check --database default;
        python /src/manage.py migrate;
        python /src/manage.py shell < /src/galaxy_ng/dev/common/setup_test_data_fs.py;
        python /src/manage.py createsuperuser --noinput || true;

        touch /var/lib/galaxy/.migrated;
        chown -R galaxy:galaxy /content /var/lib/galaxy;
      "

  api:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    ports:
      - '5677:8000'
    environment:
      <<: *common-env
    extra_hosts:
      localhost: "host-gateway"
    networks:
      - default
      - service-mesh
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Start Django development server
        python /src/manage.py runserver 0.0.0.0:8000
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/galaxy/"]
      interval: 10s
      timeout: 5s
      retries: 5

  task_worker_1:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    environment:
      <<: *common-env
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Start task worker
        python /src/manage.py run_task_worker --worker-name worker-1 --poll-interval 5
      "

  task_worker_2:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    environment:
      <<: *common-env
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Start task worker
        python /src/manage.py run_task_worker --worker-name worker-2 --poll-interval 5
      "

  task_scheduler:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    environment:
      <<: *common-env
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Start task scheduler
        python /src/manage.py run_task_scheduler --poll-interval 60
      "

  content_server:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    ports:
      - '5678:8001'
    environment:
      <<: *common-env
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Start content serving
        python /src/galaxy_ng/dev/common/serve_content.py --port 8001 --content-root /content
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health/"]
      interval: 10s
      timeout: 5s
      retries: 5

  manager:
    image: "localhost/galaxy_ng/galaxy_ng:filesystem-dev"
    depends_on:
      base_img_dev:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      task_worker_1:
        condition: service_started
      task_worker_2:
        condition: service_started
      task_scheduler:
        condition: service_started
    volumes:
      - "content_data:/content"
      - "task_data:/var/lib/galaxy/tasks"
      - "../../:/src"
      - "../../:/app"
    environment:
      <<: *common-env
    user: galaxy
    <<: *debugging
    command: |
      bash -c "
        /src/galaxy_ng/dev/compose/bin/devinstall;
        /src/galaxy_ng/dev/compose/bin/wait /var/lib/galaxy/.migrated;

        # Give some time for API to start;
        sleep 10;

        echo '################## FILESYSTEM REPOSITORIES ###################';
        ls -la /content/repositories/ || echo 'No repositories yet';

        echo '###################### TASK WORKERS ##########################';
        curl -s -u $$DJANGO_SUPERUSER_USERNAME:$$DJANGO_SUPERUSER_PASSWORD http://api:8000/api/galaxy/v3/workers/ | python -m json.tool;

        echo '###################### API ROOT ##############################';
        curl -s http://api:8000/api/galaxy/ | python -m json.tool;

        echo '################### DEV_SOURCE_PATH ##########################';
        echo $$DEV_SOURCE_PATH;

        echo '######################## READY ###############################';
        echo ' ';
        echo 'Credentials:   ' $$DJANGO_SUPERUSER_USERNAME:$$DJANGO_SUPERUSER_PASSWORD;
        echo 'API Spec:      http://localhost:5001/api/galaxy/v3/swagger-ui/';
        echo 'Content Root:  /content (mounted volume)';
        echo 'Task Storage:  /var/lib/galaxy/tasks';
        echo 'API Server:    http://localhost:5677/api/galaxy/';
        echo 'Content Server: http://localhost:5678/';
        echo 'Django Admin:  docker compose -f dev/compose/standalone-fs.yaml exec manager python /src/manage.py';
        echo 'Task Monitor:  docker compose -f dev/compose/standalone-fs.yaml exec manager python /src/manage.py list_tasks --watch';
        echo 'Validate:      docker compose -f dev/compose/standalone-fs.yaml exec manager python /src/manage.py validate_collections';
        echo '##############################################################';

        # Keep it running indefinitely to enable `docker compose -f ... exec manager /bin/bash`;
        tail -f /dev/null
      "

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      additional_contexts:
        base_img: service:base_img
    depends_on:
      base_img:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      content_server:
        condition: service_healthy
    ports:
      - '5001:5001'
    volumes:
      - '../nginx/nginx-fs.conf:/etc/nginx/nginx.conf:ro,Z'

volumes:
  content_data:
    name: galaxy_content_data
  task_data:
    name: galaxy_task_data
  pg_data:
    name: galaxy_pg_data

networks:
  service-mesh:
    name: service-mesh